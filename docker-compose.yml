services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: resort
      POSTGRES_PASSWORD: resort
      POSTGRES_DB: resort
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resort"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
